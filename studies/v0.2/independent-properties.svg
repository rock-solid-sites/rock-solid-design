<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" role="img" aria-labelledby="title description" data-study="independent-properties">
  <title id="title">Four different property website designs and four separate reservation accounts</title>
  <desc id="description">Conceptual rendering based on the reported multi-property project. Each of four property sites has a distinct design and its own external reservation account. The interfaces are abstract silhouettes, not screenshots. The straight connections represent booking responsibilities and do not specify a direct API transport or implementation completeness.</desc>
