<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" role="img" aria-labelledby="title description">
<title id="title">An adversarial design and software review workflow</title>
<desc id="description">Generic non-hospitality example: a builder submits a change for an independent reviewer to challenge. A separate verification step checks evidence before acceptance. The illustration shows a review method, not a guarantee of quality or proof of a deployed agent system.</desc>
<style>
  .outline{fill:#FAFAF8;stroke:#111111;stroke-width:3.5;stroke-linejoin:round}
  .detail{fill:none;stroke:#111111;stroke-width:2;stroke-linejoin:round}
  .ink{fill:#111111}.soft{fill:#D8D8D5}.paper{fill:#FAFAF8}
  .link{fill:none;stroke:#111111;stroke-width:3;stroke-linejoin:round}
  .label{font:700 15px system-ui,sans-serif;fill:#111111}
  .micro{font:500 12px ui-monospace,monospace;fill:#333333}
  .white{font:700 13px system-ui,sans-serif;fill:#FAFAF8}
  .hairline{fill:none;stroke:#C5C5C2;stroke-width:1}
  
</style>

<rect width="760" height="296" fill="#FAFAF8"/>
<text x="24" y="28" class="micro">SCHEMATIC STUDY / 05</text><text x="736" y="28" class="micro" text-anchor="end">ADVERSARIAL REVIEW</text><path d="M24 44H736" class="hairline"/>
<rect x="24" y="78" width="208" height="139" rx="5" class="outline"/>
<rect x="24" y="78" width="208" height="21" rx="4" class="ink"/>
<rect x="42" y="117" width="100" height="13" rx="2" class="ink"/>
<rect x="42" y="143" width="168" height="6" rx="2" class="soft"/>
<rect x="42" y="158" width="120" height="6" rx="2" class="soft"/>
<rect x="42" y="181" width="85" height="20" rx="3" class="ink"/>
<text x="128" y="236" class="label" text-anchor="middle">BUILD</text>
<text x="128" y="254" class="micro" text-anchor="middle">PROPOSE A CHANGE</text>

<rect x="276" y="78" width="208" height="139" rx="5" class="outline"/>
<rect x="276" y="78" width="208" height="21" rx="4" class="ink"/>
<rect x="293" y="116" width="170" height="28" rx="3" fill="#D8D8D5" stroke="#111111" stroke-width="2"/>
<path d="M305 130H388" class="detail"/>
<rect x="293" y="159" width="170" height="31" rx="3" fill="#FAFAF8" stroke="#111111" stroke-width="2"/>
<path d="M307 173H417" class="detail"/>
<text x="380" y="236" class="label" text-anchor="middle">CHALLENGE</text>
<text x="380" y="254" class="micro" text-anchor="middle">INDEPENDENT REVIEW</text>

<rect x="528" y="78" width="208" height="139" rx="5" class="outline"/>
<rect x="528" y="78" width="208" height="21" rx="4" class="ink"/>
<rect x="545" y="116" width="173" height="26" rx="3" fill="#FAFAF8" stroke="#111111" stroke-width="2"/>
<path d="M555 130L562 135L573 124" class="detail"/>
<path d="M587 130H702" class="detail"/>
<rect x="545" y="155" width="173" height="39" rx="3" class="soft"/>
<path d="M557 168H701M557 178H678" class="detail"/>
<text x="632" y="236" class="label" text-anchor="middle">VERIFY</text>
<text x="632" y="254" class="micro" text-anchor="middle">CHECK EVIDENCE</text>

<path d="M232 149H276M484 149H528" class="link"/>
<path d="M270 144L276 149L270 154M522 144L528 149L522 154" class="detail"/>
<text x="254" y="132" class="micro" text-anchor="middle">SEND</text>
<text x="506" y="132" class="micro" text-anchor="middle">CHECK</text>
<text x="24" y="278" class="micro">GENERIC METHOD / NOT A CERTIFICATION</text>
<text x="736" y="278" class="micro" text-anchor="end">ITERATION POSSIBLE; NO ZERO-DEFECT CLAIM</text>

</svg>
