 <rect x="320" y="657" width="14" height="14" rx="1.5" fill="#111111" stroke="#FAFAF8" stroke-width="2"/><rect x="721" y="659" width="14" height="14" rx="1.5" fill="#4C7083" stroke="#FAFAF8" stroke-width="2"/>
 <text x="515" y="638" class="mono" text-anchor="middle">BOOKING ACTION</text>
 <text x="515" y="657" class="sub" text-anchor="middle">RULE 2 / CARD REQUIRED</text>
 
<path d="M36 735H1244" stroke="#CECECB"/>
<rect x="41" y="753" width="14" height="14" rx="1.5" fill="#111111" stroke="#FAFAF8" stroke-width="2"/><text x="65" y="765" class="small" >Action origin</text>
<rect x="233" y="753" width="14" height="14" rx="1.5" fill="#4C7083" stroke="#FAFAF8" stroke-width="2"/><text x="258" y="765" class="small" >Hosted form target</text>
<path d="M477 760H530" class="connection" marker-end="url(#arrow)"/>
<text x="552" y="765" class="small" >Observed booking progression</text>
<rect x="953" y="741" width="288" height="40" rx="4" class="uncertain"/>
<text x="1096" y="766" class="amberText" text-anchor="middle">CARD FIELDS ≠ CARD CHARGE</text>
<text x="36" y="813" class="sub" >Controlled result: 0 → 2 → 0 reproduced; later rollout saved 2 for all four rooms.</text>
<text x="1243" y="813" class="sub" text-anchor="end">NO PAYMENT AUTHORIZATION CLAIM</text>
