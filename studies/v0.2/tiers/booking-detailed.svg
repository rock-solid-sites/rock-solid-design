<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title description">
<title id="title">Booking relationship — detailed structural cutaway</title>
<desc id="description">Three detailed but fictional interface silhouettes show a property website, the booking journey it offers, and the separate reservation account it depends on. Arrows are not used because data transport is not established. Labels state that the relationships are conceptual, and that technical integration and implementation status are not independently verified.</desc>
<style>
