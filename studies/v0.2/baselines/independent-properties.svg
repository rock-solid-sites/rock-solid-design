<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" role="img" aria-labelledby="title description" data-study="neutral-independent-properties">
  <title id="title">Neutral boxes for four independently designed sites and their respective reservation accounts</title>
  <desc id="description">Neutral comparator preserves the facts of four independent website designs and four separate accounts, without visual cutaway treatment.</desc>
