  <title id="title">A change in website and booking architecture</title>
  <desc id="description">Conceptual comparison: an embedded booking interface in a legacy site, an evaluation step, and a modern web interface with its own integration layer. This is not a claim about a deployed system.</desc>
  <rect width="560" height="215" rx="4" fill="#FAFAF8"/>
  <g stroke="#111111" stroke-width="3" fill="none">
    <rect x="12" y="35" width="143" height="121" rx="4"/>
    <rect x="209" y="68" width="142" height="54" rx="4"/>
    <rect x="405" y="35" width="143" height="121" rx="4"/>
    <path d="M155 95H209M351 95H405"/>
  </g>
  <g fill="#111111">
    <rect x="12" y="35" width="143" height="17" rx="3"/>
    <rect x="405" y="35" width="143" height="17" rx="3"/>
    <rect x="22" y="63" width="70" height="10" rx="2"/>
    <rect x="415" y="63" width="101" height="10" rx="2"/>
    <rect x="416" y="103" width="122" height="38" rx="3"/>
  </g>
  <rect x="22" y="83" width="123" height="59" rx="3" fill="none" stroke="#111111" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="31" y="95" width="96" height="9" rx="1" fill="#D8D8D5"/>
  <rect x="31" y="111" width="76" height="6" rx="1" fill="#D8D8D5"/>
  <rect x="31" y="124" width="86" height="6" rx="1" fill="#D8D8D5"/>
  <g font-family="monospace" font-size="11" fill="#111111" text-anchor="middle">
    <text x="83" y="23">LEGACY</text>
    <text x="280" y="23">EVALUATE</text>
    <text x="477" y="23">NEW APPROACH</text>
    <text x="280" y="90">TECHNICAL</text><text x="280" y="106">PIVOT</text>
    <text x="83" y="175">Embedded booking</text>
    <text x="477" y="175">Custom integration</text>
  </g>
  <path d="M195 90l10 5-10 5M391 90l10 5-10 5" stroke="#111111" stroke-width="2" fill="none" stroke-linejoin="round"/>
