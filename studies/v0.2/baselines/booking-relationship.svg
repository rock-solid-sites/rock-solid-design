<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" role="img" aria-labelledby="title description" data-study="neutral-booking-relationship">
  <title id="title">Neutral boxes for a website, booking experience and reservation service</title>
  <desc id="description">Neutral comparison of the same three responsibilities as the structural-cutaway booking relationship. Lines represent associations, not verified interfaces.</desc>
  <style>
    .label{font:700 13px system-ui,sans-serif;fill:#111111}
    .micro{font:500 11px ui-monospace,monospace;fill:#111111}
    .muted{font:500 11px ui-monospace,monospace;fill:#555555}
    .white{font:700 13px system-ui,sans-serif;fill:#FAFAF8}
    .guide{stroke:#C5C5C2;stroke-width:1;fill:none}
    .frame{fill:#FAFAF8;stroke:#111111;stroke-width:3.5;stroke-linejoin:round}
    .detail{fill:none;stroke:#111111;stroke-width:2;stroke-linejoin:round}
    .link{fill:none;stroke:#111111;stroke-width:3;stroke-linecap:square;stroke-linejoin:round}
    .fill{fill:#111111}
    .soft{fill:#D8D8D5}
  </style>
  <rect width="760" height="296" rx="4" fill="#FAFAF8"/>
  <path d="M24 44H736" class="guide"/>
<g stroke="#111111" stroke-width="1.5" fill="#FAFAF8"><text x="24" y="28" class="muted" >RSS / STRUCTURAL CUTAWAY / 01</text><text x="736" y="28" class="muted" text-anchor="end">NEUTRAL REFERENCE</text>
<rect x="24" y="98" width="202" height="90" rx="0"/><rect x="280" y="98" width="202" height="90" rx="0"/><rect x="534" y="98" width="202" height="90" rx="0"/>
<path d="M226 143H280M482 143H534" stroke="#111111" stroke-width="1.5" fill="none"/>
<text x="125" y="142" class="label" text-anchor="middle">PROPERTY WEBSITE</text>
<text x="381" y="142" class="label" text-anchor="middle">BOOKING EXPERIENCE</text>
<text x="635" y="135" class="label" text-anchor="middle">EXTERNAL</text>
<text x="635" y="154" class="label" text-anchor="middle">RESERVATIONS</text>
<text x="24" y="278" class="micro" >NEUTRAL BASELINE / RELATIONSHIP NOT TRANSPORT</text>
</g>
</svg>
