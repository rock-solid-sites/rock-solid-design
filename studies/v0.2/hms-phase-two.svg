  <title id="title">A second phase expands the scope from site and booking work to management and marketing</title>
  <desc id="description">Reported roadmap. An initial workstream develops property websites and booking connections. A second phase, HMS, is in development and intends to better integrate day-to-day management and marketing. The diagram shows a phase progression, not a deployed technical connection or confirmed feature set.</desc>
