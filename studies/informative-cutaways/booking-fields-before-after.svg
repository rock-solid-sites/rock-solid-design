 <rect x="684" y="507" width="559" height="214" rx="5" class="frame"/><rect x="686" y="509" width="555" height="27" rx="3" fill="#111111"/><text x="699" y="527" class="monoWhite" >BEDS24 / HOSTED BOOKING FORM</text>
 <text x="708" y="564" class="mono" >GUEST DETAILS</text>
