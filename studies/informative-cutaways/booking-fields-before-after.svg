 <rect x="55" y="316" width="272" height="40" rx="4" fill="#111111"/>
 <text x="190" y="341" class="white" text-anchor="middle">BOOK NOW</text>
 <rect x="684" y="178" width="559" height="214" rx="5" class="frame"/><rect x="686" y="180" width="555" height="27" rx="3" fill="#111111"/><text x="699" y="198" class="monoWhite" >BEDS24 / HOSTED BOOKING FORM</text>
