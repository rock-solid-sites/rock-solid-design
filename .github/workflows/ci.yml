name: Design package checks
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: python3 scripts/validate-study-svg.py
      - run: npm pack --dry-run

  gallery-snapshots:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Capture real Chromium gallery renders
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo "No Chromium browser available; visual snapshots cannot be verified." >&2
            exit 1
          fi
          "$BROWSER" --version
          mkdir -p review-snapshots
          BASE="file://$PWD/studies/v0.2/review/gallery.html"
          take() {
            local out="$1" width="$2" height="$3" subject="$4" variant="$5" size="$6"
            "$BROWSER" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu \
              --hide-scrollbars --no-first-run --force-device-scale-factor=1 \
              --virtual-time-budget=2500 --window-size="$width,$height" \
              --screenshot="$PWD/review-snapshots/$out.png" \
              "$BASE?case=$subject&variant=$variant&size=$size" >/dev/null 2>&1
            test -s "review-snapshots/$out.png"
          }
          take booking-c-desktop    1440 1200 booking-relationship cutaway M
          take booking-neutral      1440 1200 booking-relationship neutral M
          take booking-prose        1440 1200 booking-relationship prose M
          take booking-s-mobile      390 1800 booking-relationship cutaway S
          take booking-l-desktop    1440 1200 booking-relationship cutaway L
          take architecture-desktop 1440 1200 architecture-pivot cutaway M
          take properties-desktop   1440 1200 independent-properties cutaway M
          take hms-desktop          1440 1200 hms-phase-two cutaway M
          take review-desktop       1440 1200 adversarial-review cutaway M
          python3 - <<'PY'
          from pathlib import Path
          from struct import unpack
          for file in sorted(Path("review-snapshots").glob("*.png")):
              data = file.read_bytes()
              assert data[:8] == b"\x89PNG\r\n\x1a\n", file
              width, height = unpack(">II", data[16:24])
              print(f"{file.name}: {width}x{height}, {len(data):,} bytes")
              assert width >= 390 and height >= 1100
          assert len(list(Path("review-snapshots").glob("*.png"))) == 9
          PY
      - name: Upload review evidence (not a usability test)
        uses: actions/upload-artifact@v4
        with:
          name: schematic-treatment-c-review-snapshots
          path: review-snapshots/
          if-no-files-found: error
          retention-days: 14
