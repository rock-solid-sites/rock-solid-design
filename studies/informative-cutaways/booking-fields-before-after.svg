<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 830" role="img" aria-labelledby="t d">
<title id="t">One booking rule changes which card fields appear</title>
<desc id="d">A paired structural-cutaway illustration showing an earlier controlled Chill Zone booking form with zero credit-card fields and the same form after an Offer 1 booking-rule change with six fields. Heavy black lines start inside a booking button and end at a Continue control within the external guest form; filled square markers identify those action points. The change was tested and rolled back, then applied across four Chill Zone room types. It does not establish successful card charging.</desc>
<defs><pattern id="g" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M8 0H0V8" stroke="#111111" stroke-opacity=".035" fill="none"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#111111"/></marker></defs>
<style>
.frame{fill:#FAFAF8;stroke:#111111;stroke-width:4;stroke-linejoin:round}
.external{fill:#E1E9ED;stroke:#4C7083;stroke-width:2.5}
.uncertain{fill:#F2EADD;stroke:#A67A40;stroke-width:2.5}
.connection{fill:none;stroke:#111111;stroke-width:4;stroke-linecap:square;stroke-linejoin:round}
.head{font:750 27px system-ui,sans-serif;fill:#111111}
.label{font:720 18px system-ui,sans-serif;fill:#111111}
.small{font:500 15px system-ui,sans-serif;fill:#111111}
.white{font:750 15px system-ui,sans-serif;fill:#FAFAF8}
.mono{font:650 12px ui-monospace,Consolas,monospace;fill:#111111}
.monoWhite{font:650 12px ui-monospace,Consolas,monospace;fill:#FAFAF8}
.sub{font:550 12px ui-monospace,Consolas,monospace;fill:#464649}
.blueText{font:700 14px system-ui,sans-serif;fill:#4C7083}
.amberText{font:700 14px system-ui,sans-serif;fill:#805C2B}
.mini{font:650 11px ui-monospace,Consolas,monospace;fill:#111111}
</style>
<rect width="1280" height="830" fill="#FAFAF8"/><rect width="1280" height="830" fill="url(#g)"/>
<text x="36" y="38" class="mono" >TREATMENT C / EVIDENCE-BASED CUTAWAY / 01</text>
<text x="36" y="78" class="head" >One rule. Two booking forms.</text>
<text x="36" y="102" class="small" >Chill Zone / controlled Offer 1 test and production rollout</text>
<path d="M36 121H1244" stroke="#CECECB"/>
<rect x="35" y="137" width="502" height="28" rx="4" class="uncertain"/>
<text x="49" y="157" class="amberText" >BEFORE: OFFER 1 DEFAULT (0)</text>
<text x="1240" y="157" class="mono" text-anchor="end">HISTORICAL / ZERO CARD FIELDS</text>

 <rect x="34" y="178" width="336" height="214" rx="5" class="frame"/><rect x="36" y="180" width="332" height="27" rx="3" fill="#111111"/><text x="49" y="198" class="monoWhite" >PROPERTY SITE / CHILL ZONE</text>
