<rect x="35" y="466" width="502" height="28" rx="4" class="external"/>
<text x="49" y="486" class="blueText" >AFTER: CONFIRMED WITH CARD (2)</text>
<text x="1240" y="486" class="mono" text-anchor="end">FOUR ROOM TYPES / SIX FIELDS</text>

