<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" role="img" aria-labelledby="title description" data-study="booking-relationship">
  <title id="title">A property website, booking experience and reservation platform</title>
  <desc id="description">Generic study inspired by a multi-property hospitality project. The customer's website includes a booking journey and has a reservation-platform dependency. The diagram does not assert how reservations travel over the network or that any proposed direct API integration is deployed.</desc>
  <style>
    .label{font:700 13px system-ui,sans-serif;fill:#111111}
    .micro{font:500 11px ui-monospace,monospace;fill:#111111}
    .muted{font:500 11px ui-monospace,monospace;fill:#555555}
    .white{font:700 13px system-ui,sans-serif;fill:#FAFAF8}
    .guide{stroke:#C5C5C2;stroke-width:1;fill:none}
    .frame{fill:#FAFAF8;stroke:#111111;stroke-width:3.5;stroke-linejoin:round}
    .detail{fill:none;stroke:#111111;stroke-width:2;stroke-linejoin:round}
    .link{fill:none;stroke:#111111;stroke-width:3;stroke-linecap:square;stroke-linejoin:round}
    .fill{fill:#111111}
    .soft{fill:#D8D8D5}
  </style>
  <rect width="760" height="296" rx="4" fill="#FAFAF8"/>
  <path d="M24 44H736" class="guide"/>

