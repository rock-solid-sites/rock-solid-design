  .ink{fill:#111111}.soft{fill:#D8D8D5}.paper{fill:#FAFAF8}
  .link{fill:none;stroke:#111111;stroke-width:3;stroke-linejoin:round}
  .label{font:700 15px system-ui,sans-serif;fill:#111111}
  .micro{font:500 12px ui-monospace,monospace;fill:#333333}
  .white{font:700 13px system-ui,sans-serif;fill:#FAFAF8}
  .hairline{fill:none;stroke:#C5C5C2;stroke-width:1}
  
</style>

